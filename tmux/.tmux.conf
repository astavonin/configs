# Vim-like bindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Two clipboard paths, because neither covers both cases:
#  - copy-pipe reaches the clipboard of the machine tmux runs on (local use).
#  - set-clipboard emits OSC 52, which reaches the clipboard of the machine the
#    terminal runs on (ssh, nested tmux). "on" (not "external") is required on
#    the OUTER tmux: external ignores OSC 52 arriving from apps running inside.
# OSC 52 alone is not enough here: GNOME Terminal (VTE) never implemented the
# clipboard write and drops the sequence silently.
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; else cat >/dev/null; fi'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; else cat >/dev/null; fi'
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
set -g mouse on

# NeoVim settings
set-option -sg escape-time 10
set -g default-terminal "tmux-256color"

# Only apply on macOS
if-shell 'test "$(uname -s)" = "Darwin"' \
    'set-option -g default-command "arch -arch arm64 /opt/homebrew/bin/zsh"'

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# move window left/right with Ctrl-b Shift-Arrow
bind S-Left swap-window -t -1\; select-window -t -1
bind S-Right swap-window -t +1\; select-window -t +1

# kill window
bind q killw
unbind &

# Override ctrl-b c to create window with custom layout
bind-key c new-window -c ~ -n "session_#I" \; \
    split-window -c ~ -h -l 45% \; \
    split-window -c ~ -v \; \
    select-pane -t 0

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# https://github.com/arcticicestudio/nord-tmux
set -g @plugin "arcticicestudio/nord-tmux"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
