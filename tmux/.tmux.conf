# Vim-like bindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# OSC 52: copy reaches the clipboard of the machine the TERMINAL runs on, so it
# survives ssh and nested tmux. Requires a terminal that implements the escape
# (Ghostty, iTerm2 -- the latter behind Settings > General > Selection). "on",
# not "external": external ignores OSC 52 arriving from apps running inside.
# Mouse selection needs no binding; the stock MouseDragEnd1Pane already routes
# through here.
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
set -g mouse on

# NeoVim settings. escape-time is left to tmux-sensible, which sets 0.
# default-terminal is NOT: sensible would downgrade it to screen-256color,
# which drops italics.
set -g default-terminal "tmux-256color"

# iTerm2 reports TERM=xterm-256color, whose terminfo advertises neither RGB nor
# Tc, so tmux silently downgrades truecolor to a 256-colour approximation.
# Declaring the capability is safe for every xterm-256color terminal in use
# here -- both iTerm2 and VTE do 24-bit colour. Ghostty needs no entry: its
# xterm-ghostty terminfo carries Tc and is detected. "-a" appends, so tmux's
# built-in feature list (xterm*:clipboard among them) is preserved.
set -as terminal-features ",xterm-256color:RGB"

# Only apply on macOS
if-shell 'test "$(uname -s)" = "Darwin"' \
    'set-option -g default-command "arch -arch arm64 /opt/homebrew/bin/zsh"'

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# move window left/right with Ctrl-b Shift-Arrow
bind S-Left swap-window -t -1\; select-window -t -1
bind S-Right swap-window -t +1\; select-window -t +1

# kill window
bind q killw
unbind &

# Override ctrl-b c to create window with custom layout
bind-key c new-window -c ~ -n "session_#I" \; \
    split-window -c ~ -h -l 45% \; \
    split-window -c ~ -v \; \
    select-pane -t 0

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# https://github.com/arcticicestudio/nord-tmux
set -g @plugin "arcticicestudio/nord-tmux"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
